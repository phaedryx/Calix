name: Calix
options:
  bundleIdPrefix: com.calix
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# DebugUITesting is a debug-type config used ONLY by the CalixUITests
# scheme's test action (see schemes.CalixUITests.test.config below), so
# the Calix.app built for UI testing gets an isolated
# PRODUCT_BUNDLE_IDENTIFIER (com.calix.terminal.e2e, set below on the
# Calix target) distinct from the production com.calix.terminal used by
# every other config. This prevents LaunchServices from ever conflating
# a locally-installed production Calix.app with the UI-test-built one,
# which previously let XCUITest keystrokes leak into whichever app
# LaunchServices considered the "real" com.calix.terminal.
configs:
  Debug: debug
  Release: release
  DebugUITesting: debug

settings:
  base:
    SWIFT_VERSION: "6.2"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    OTHER_LDFLAGS:
      - -framework Metal
      - -framework MetalKit
      - -framework QuartzCore
      - -framework CoreGraphics
      - -framework Foundation
      - -framework IOKit
      - -framework CoreText
      - -lz
      - -lc++
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS:
        - DEBUG

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.5.0"

targets:
  Calix:
    type: application
    platform: macOS
    sources:
      - path: Calix
        excludes:
          - "**/*.entitlements"
    postBuildScripts:
      - script: |
          cp -R "${PROJECT_DIR}/Resources/ghostty" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/ghostty"
          cp -R "${PROJECT_DIR}/Resources/terminfo" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/terminfo"
        name: Copy Ghostty Resources
      - script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin"
          # rm before cp: same stale-code-signature-cache SIGKILL risk as the Bundle Session Daemon script below.
          rm -f "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin/calix"
          cp "${BUILT_PRODUCTS_DIR}/calix" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin/calix"
        name: Bundle CalixCLI
      - script: |
          set -e
          SESSION_BIN="${PROJECT_DIR}/build/session/calix-session"
          if [ -f "$SESSION_BIN" ]; then
            mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin"
            # rm before cp: overwriting the same inode in place leaves the
            # kernel's code-signature cache stale for a binary that has
            # already been executed, and every later exec of it dies with
            # SIGKILL (field-verified: exit 137 at the bundle path, same
            # bytes run fine after an rm+cp re-copy created a fresh inode).
            rm -f "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin/calix-session"
            cp "$SESSION_BIN" "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin/calix-session"
            chmod 0755 "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin/calix-session"
          elif [ "${CONFIGURATION}" = "Release" ]; then
            # Hard error only for Release: a shipped build must carry the
            # session daemon. Every other config (Debug, DebugUITesting,
            # any future debug variant) warns and skips below, so e.g.
            # UI-test builds don't fail when build-session.sh was never run.
            echo "error: build/session/calix-session not found for a ${CONFIGURATION} build. Run scripts/build-session.sh before building Release."
            exit 1
          else
            echo "warning: build/session/calix-session not found. Run scripts/build-session.sh to enable persistent sessions in this ${CONFIGURATION} build. Skipping (feature stays gated off)."
          fi
        name: Bundle Session Daemon
      - script: |
          set -e
          # Linux musl payloads for remote-install, produced by
          # scripts/build-session.sh --all. They are ELF, not Mach-O:
          # codesign seals them as plain resources, so no per-binary
          # signing step exists for them. rm before cp kept anyway for
          # parity with the other bundling steps' stale-inode rule.
          for REMOTE_ARCH in x86_64 aarch64; do
            SRC="${PROJECT_DIR}/build/session/session-remote/${REMOTE_ARCH}/calix-session"
            DEST_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/session-remote/${REMOTE_ARCH}"
            if [ -f "$SRC" ]; then
              mkdir -p "$DEST_DIR"
              rm -f "$DEST_DIR/calix-session"
              cp "$SRC" "$DEST_DIR/calix-session"
              chmod 0755 "$DEST_DIR/calix-session"
            elif [ "${CONFIGURATION}" = "Release" ]; then
              # Hard error only for Release: a shipped build must carry the
              # remote payloads. Every other config (Debug, DebugUITesting,
              # any future debug variant) warns and skips below, so e.g.
              # UI-test builds don't fail when --all was never run.
              echo "error: $SRC not found for a ${CONFIGURATION} build. Run scripts/build-session.sh --all before building Release."
              exit 1
            else
              echo "warning: $SRC not found. Run scripts/build-session.sh --all to enable remote install in this ${CONFIGURATION} build. Skipping (remote install stays unavailable)."
            fi
          done
        name: Bundle Remote Session Binaries
    info:
      path: Calix/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        SUFeedURL: https://yuuichieguchi.github.io/Calyx/appcast.xml
        SUPublicEDKey: PCj8Kd8fh5sr8y4hhYbT7ER9hDOHUMLFRl9FBSzad2U=
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
        NSServices:
          - NSMenuItem:
              default: Open in Calix
            NSMessage: openInCalix
            NSPortName: Calix
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendTypes:
              - NSFilenamesPboardType
              - public.plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calix.terminal
        PRODUCT_NAME: Calix
        MARKETING_VERSION: "0.32.1"
        CURRENT_PROJECT_VERSION: 58
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Calix/Calix.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
        debuguitesting:
          # Exact-match key (case-insensitive) against the "DebugUITesting"
          # config name — applies ONLY to that config, not to Debug/Release.
          PRODUCT_BUNDLE_IDENTIFIER: com.calix.terminal.e2e
    dependencies:
      - framework: GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: WebKit.framework
      - sdk: UserNotifications.framework
      - package: Sparkle
      - target: CalixCLI
        embed: false

  CalixTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CalixTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Calix

  CalixUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: CalixUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Calix
    dependencies:
      - target: Calix

  CalixCLI:
    type: tool
    platform: macOS
    sources:
      - path: CalixCLI
    settings:
      base:
        PRODUCT_NAME: calix
        PRODUCT_MODULE_NAME: CalixCLI
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    dependencies:
      - package: swift-argument-parser
        product: ArgumentParser

schemes:
  Calix:
    build:
      targets:
        Calix: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # CalixUITests is deliberately excluded here: this scheme's test
        # action only has one shared `config` for all listed targets, and
        # that config (Debug) builds the app-under-test with the
        # production PRODUCT_BUNDLE_IDENTIFIER. Running UI tests through
        # this scheme would silently reintroduce the bundle-ID collision
        # that the isolated `CalixUITests` scheme (test.config:
        # DebugUITesting) exists to prevent. Use the CalixUITests scheme
        # directly for UI tests.
        - CalixTests
  CalixTests:
    build:
      targets:
        Calix: [run, test]
        CalixTests: test
    test:
      config: Debug
      targets:
        - CalixTests
  CalixUITests:
    build:
      targets:
        Calix: [run, test]
        CalixUITests: test
    test:
      # Builds the Calix app-under-test with PRODUCT_BUNDLE_IDENTIFIER
      # com.calix.terminal.e2e (see the DebugUITesting config above),
      # isolating it from the production com.calix.terminal bundle ID.
      config: DebugUITesting
      targets:
        - CalixUITests
      # Propagates the invoking shell's CALIX_SESSION_BIN (a pre-built
      # calix-session path pinned by E2E suites, e.g.
      # SessionBrowserAttachKillE2ETests.swift) into the .xctestrun's own
      # environment, so the test runner process sees it without a
      # manual PlistBuddy patch of the generated .xctestrun afterward.
      environmentVariables:
        CALIX_SESSION_BIN: $(CALIX_SESSION_BIN)
        # Same propagation rationale as CALIX_SESSION_BIN above:
        # scripts/record-demo.sh's own `CALIX_DEMO_RECORDING=1` shell
        # prefix does not otherwise reach the test runner process.
        CALIX_DEMO_RECORDING: $(CALIX_DEMO_RECORDING)

fileGroups:
  - Calix-Bridging-Header.h
